[package]
name = "perp-engine"
description = "0G PerpDEX matching engine: order placement/cancellation/matching, settlement, risk, funding — generic over a PerpHost. Consumable without building the EVM stack."
version = "1.0.0"
authors.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
perp-core.workspace = true
primitives.workspace = true
context-interface.workspace = true
alloy-primitives.workspace = true
alloy-sol-types.workspace = true
ed25519-dalek.workspace = true
serde.workspace = true

[dev-dependencies]
# Engine tests drive the real revm Journal through the blanket ContextTr host impl.
context.workspace = true
database = { workspace = true, features = ["std"] }
rstest.workspace = true
blake3 = { workspace = true, features = ["std"] }

[features]
default = ["std"]
std = ["perp-core/std", "primitives/std", "context-interface/std", "ed25519-dalek/std"]
