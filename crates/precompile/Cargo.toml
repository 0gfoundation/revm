[package]
name = "revm-precompile"
description = "Revm Precompiles - Ethereum compatible precompiled contracts"
version = "27.0.0"
authors.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
# revm
primitives.workspace = true
context.workspace = true
perp-core.workspace = true
bytecode.workspace = true

# modexp precompiles
aurora-engine-modexp.workspace = true
# gmp wrapper
rug = { workspace = true, features = ["integer"], optional = true }

# ecRecover
k256 = { workspace = true, features = ["ecdsa"] }
secp256k1 = { workspace = true, features = [
	"alloc",
	"recovery",
	"rand",
	"global-context",
], optional = true }
libsecp256k1 = { workspace = true, features = [
	"static-context",
], optional = true }

# SHA2-256 and RIPEMD-160
sha2.workspace = true
ripemd.workspace = true

# Optionally use substrate implementation for eip1962
bn = { workspace = true, optional = true }

# Use arkworks implementation for eip1962
ark-bn254 = { workspace = true, features = ["curve"] }
ark-ec = { workspace = true }
ark-ff = { workspace = true, features = ["asm"] }
ark-serialize = { workspace = true }

# KZG point evaluation precompile
c-kzg = { workspace = true, optional = true, features = [
	"ethereum_kzg_settings",
] }

# Optionally use `kzg-rs` for a pure Rust implementation of KZG point evaluation.
kzg-rs = { workspace = true, optional = true }

# Use the BLS12-381 implementation of blst for EIP2537
blst = { workspace = true, optional = true }

# Use the BLS12-381 implementation of arkworks for EIP2537
ark-bls12-381 = { workspace = true, features = ["curve"] }

# p256verify precompile
p256 = { workspace = true, features = ["ecdsa"] }

# ed25519 signature verification for signed order submission
ed25519-dalek.workspace = true

# utils
cfg-if.workspace = true
arrayref = "0.3.6"
rmp-serde.workspace = true
serde.workspace = true
# BLAKE3 for the PerpDEX off-trie commitment hash (faster than keccak; the slot is an internal
# anchor so the hash function is a free choice).
blake3.workspace = true
# Compact PerpDEX blob encoding: integer-repr enums + msgpack-bin fixed byte arrays.
serde_repr.workspace = true
serde_bytes.workspace = true

# alloy

alloy-primitives.workspace = true
alloy-sol-types.workspace = true

# bench-util only (HL-window on-chain replay harness)
database = { workspace = true, features = ["std"], optional = true }
state = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true
rand = { workspace = true, features = ["std"] }
ark-std = { workspace = true }
rstest.workspace = true
database = { workspace = true, features = ["std"] }

[features]
default = ["std", "secp256k1", "blst", "c-kzg", "portable"]
std = [
	"primitives/std",
	"k256/std",
	"ripemd/std",
	"sha2/std",
	"c-kzg?/std",
	"secp256k1?/std",
	"libsecp256k1?/std",
	"ark-bn254/std",
	"ark-bls12-381/std",
	"aurora-engine-modexp/std",
	"ark-ec/std",
	"ark-ff/std",
	"ark-serialize/std",
	"ark-std/std",
	"p256/std",
	"ed25519-dalek/std",
	"rug?/std",
	"blake3/std",
]
hashbrown = ["primitives/hashbrown"]
# In-memory bench fixtures + the HL-window replay harness (`bench_util`, `hl_window_replay` bin).
bench-util = ["std", "dep:database", "dep:state"]
asm-keccak = ["primitives/asm-keccak"]
asm-sha2 = ["sha2/asm"]


# Enables the c-kzg point evaluation precompile. Enabled by default as most stable/used implementation.
c-kzg = ["dep:c-kzg"]
# `kzg-rs` is not audited but useful for `no_std` environment, use it with causing and default to `c-kzg` if possible.
kzg-rs = ["dep:kzg-rs"]

# Compile in portable mode, without ISA extensions.
# Binary can be executed on all systems.
portable = ["c-kzg?/portable", "blst?/portable"]

# Use `secp256k1` as a faster alternative to `k256`.
# The problem that `secp256k1` has is it fails to build for `wasm` target on Windows and Mac as it is c lib.
# In Linux it passes. If you don't require to build wasm on win/mac, it is safe to use it and it is enabled by default.
secp256k1 = ["dep:secp256k1"]
libsecp256k1 = ["dep:libsecp256k1"]

# Enables the blst implementation of the BLS12-381 precompile.
blst = ["dep:blst"]

# Enables the substrate implementation of eip1962
bn = ["dep:bn"]

# Use rug (that wraps gmp) for modexp precompile.
# It is faster library but licences as GPL code, if enabled please make sure to follow the license.
gmp = ["dep:rug"]

[[bin]]
name = "hl_window_replay"
path = "src/bin/hl_window_replay.rs"
required-features = ["bench-util"]

[[bench]]
name = "bench"
path = "bench/main.rs"
harness = false
required-features = ["secp256k1"]
